authorship: >-
  Written by API Evangelist from live HTTP probes run 2026-08-30. Every entry
  below records the endpoint, the status code and the response detail that
  established it. UCM published none of this file; UCM published the endpoints
  it describes.
note: >-
  Education-regime domain-standard conformance for Universidad Complutense de
  Madrid, established by live probe on 2026-08-30 rather than from a prose claim.
  UCM publishes no OpenAPI, AsyncAPI or developer portal of its own, so every
  entry below is evidenced by an HTTP response from a named endpoint, with the
  status code recorded. Only surfaces UCM itself operates or holds an
  institution-specific account on are counted; the shared UniversiDATA consortium
  platform and the RedIRIS-hosted identity provider are labelled as such.
  Reward-only: a standard with no live evidence is recorded conforms:false, never
  inferred from the presence of the software that usually implements it.
regime: education
regime_id: education
standards:
- id: oai-pmh
  conforms: true
  operator: institution
  endpoint: https://docta.ucm.es/rest/oai/request
  evidence: >-
    GET https://docta.ucm.es/rest/oai/request?verb=Identify returned HTTP 200
    text/xml with <repositoryName>Docta Complutense</repositoryName>,
    <baseURL>https://docta.ucm.es/rest/oai/request</baseURL>, protocolVersion
    2.0, adminEmail docta@ucm.es, repositoryIdentifier docta.ucm.es,
    earliestDatestamp 2023-06-14T07:40:24Z, granularity
    YYYY-MM-DDThh:mm:ssZ. ListMetadataFormats returned HTTP 200 with twelve
    prefixes: oai_dc, qdc, mods, mets, marc, etdms, didl, ore, rdf, xoai, dim,
    uketd_dc. Host docta.ucm.es is under UCM's own registrable domain.
  probed: '2026-08-30'
  status: 200
- id: saml
  conforms: true
  operator: tenant
  endpoint: https://www.rediris.es/sir/ucmidp
  evidence: >-
    UCM is registered in eduGAIN as a SAML 2.0 Identity Provider, entityID
    https://www.rediris.es/sir/ucmidp, role IDPSSODescriptor, registration
    authority http://www.rediris.es/ (RedIRIS SIR, the Spanish national R&E
    federation), displayName "Complutense University of Madrid" /
    "Universidad Complutense de Madrid", shibmd:Scope ucm.es, Sirtfi asserted,
    first seen 2017-04-13. GET on the entityID returned HTTP 200 text/xml, 10279
    bytes of md:EntitiesDescriptor with SSOService at
    https://sir.rediris.es/ucm/saml2/idp/SSOService.php and
    SingleLogoutService at https://sir.rediris.es/ucm/saml2/idp/SingleLogoutService.php.
    Operator is tenant, not institution: the IdP endpoints run on RedIRIS
    infrastructure under a UCM-specific /ucm/ path, and OrganizationURL points
    back to http://www.ucm.es/.
  probed: '2026-08-30'
  status: 200
- id: shibboleth
  conforms: partial
  operator: tenant
  endpoint: https://www.rediris.es/sir/ucmidp
  evidence: >-
    The UCM IdP metadata carries the Shibboleth metadata extension
    <shibmd:Scope regexp="false">ucm.es</shibmd:Scope> and is consumed by the
    Shibboleth-compatible eduGAIN/SIR federation, but the deployed SSO endpoints
    are SimpleSAMLphp (saml2/idp/SSOService.php), not a Shibboleth IdP. Recorded
    partial so the federation membership is not read as a Shibboleth software
    deployment.
  probed: '2026-08-30'
  status: 200
- id: dcat
  conforms: true
  operator: tenant
  endpoint: https://universidatacatalog.azurewebsites.net/api/universidades/ucm
  evidence: >-
    GET returned HTTP 200 application/xml, 561329 bytes of rdf:RDF using the
    dcat, dct, foaf and adms vocabularies — UCM's dataset catalogue on the
