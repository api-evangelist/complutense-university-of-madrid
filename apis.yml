    name: Docta Complutense OAI-PMH Endpoint
    x-operator: institution
    description: >-
      OAI-PMH 2.0 harvesting endpoint for Docta Complutense, on UCM's own host.
      Probed 2026-08-30: verb=Identify returns HTTP 200 text/xml with
      repositoryName "Docta Complutense", repositoryIdentifier docta.ucm.es,
      adminEmail docta@ucm.es, earliestDatestamp 2023-06-14, granularity
      YYYY-MM-DDThh:mm:ssZ; verb=ListMetadataFormats returns twelve prefixes
      (oai_dc, qdc, mods, mets, marc, etdms, didl, ore, rdf, xoai, dim,
      uketd_dc). This is the education-regime oai-pmh conformance evidence and
      the clearest institution-operated machine-readable surface UCM has.
    humanURL: https://docta.ucm.es/
    baseURL: https://docta.ucm.es/rest/oai/request
