description: >-
  Universidad Complutense de Madrid (UCM) is Spain's largest public research
  university, founded 1499 and ranked #164 in the QS World University Rankings
  2025. UCM operates no central developer portal and publishes no OpenAPI,
  AsyncAPI or SDK of its own — a re-profile on 2026-08-30 probed every candidate
  host and found none. What it does operate, verified live, is two things. First,
  Docta Complutense (docta.ucm.es), its institutional repository, self-hosted on
  UCM's own domain running DSpace 7.6.5: the DSpace REST/HAL API answers at
  /rest/api and an OAI-PMH 2.0 endpoint answers verb=Identify at
  /rest/oai/request with twelve metadata formats. The repository is UCM's; the
  API contract is DSpace's open-source one and is not saved here. Second, UCM is
  registered in eduGAIN through the Spanish RedIRIS SIR federation as a SAML 2.0
  Identity Provider (entityID https://www.rediris.es/sir/ucmidp, scope ucm.es,
  Sirtfi asserted) — machine-readable, institution-scoped, but hosted on RedIRIS
  infrastructure, so recorded as a tenant relationship. UCM's open data is not
  self-hosted either: it is published through UniversiDATA, a five-university
  DKAN consortium portal (UAM, UCM, UHU, UVa, URJC) that exposes DataStore, CKAN
  and DCAT APIs. Thirteen of the portal's seventy-one datasets are UCM's —
  degree programmes, faculties, departments, budgets, mobility and procurement.
  UCM's data, the consortium's platform, so every UniversiDATA surface below is
  x-operator tenant, not institution. No course/timetable API, no library
  discovery API, no research-computing or campus-life API was found on any
  ucm.es host.
