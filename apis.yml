  - aid: complutense-university-of-madrid:universidata-datastore
    name: UniversiDATA DataStore API
    x-operator: tenant
    description: >-
      DataStore query API of UniversiDATA, the DKAN open-data platform shared by
      five Spanish public universities (UAM, UCM, UHU, UVa, URJC) of which UCM is
      a founding member. Returns the records of a published resource as JSON,
      XML or JSONP, with limit, offset, filters, fields, sort, query and
      multi-resource join parameters. Probed 2026-08-30: HTTP 200
      application/json against a resource_id. The platform and the contract
      belong to the consortium, not to UCM alone — hence tenant.
    humanURL: https://www.universidata.es/el-api
    baseURL: https://www.universidata.es/api/action/datastore/search.json
    tags:
    - Open Data
    - DataStore
    - DKAN
    - Datasets
    properties:
      - type: Documentation
        url: https://www.universidata.es/el-api
  - aid: complutense-university-of-madrid:universidata-ckan
    name: UniversiDATA CKAN Dataset API
    x-operator: tenant
    description: >-
      CKAN-compatible metadata API of the UniversiDATA consortium platform,
      supporting current_package_list_with_resources, package_show and
      resource_show. Probed 2026-08-30: HTTP 200 application/json returning 71
      packages across the five member universities, of which 13 are UCM's —
      UCM-Titulaciones, UCM-Centros, UCM-Departamentos, UCM-Presupuesto de
      Gastos, UCM-Presupuesto de Ingresos, UCM-Movilidad-Entrantes,
      UCM-Movilidad-Salientes and UCM-Licitaciones de Contratos Mayores among
      them. The action root https://www.universidata.es/api/3/action/ itself
      returns HTTP 404, so baseURL points at the live
      current_package_list_with_resources action; other actions follow the
      same /api/3/action/<action> pattern.
    humanURL: https://www.universidata.es/el-api
    baseURL: https://www.universidata.es/api/3/action/current_package_list_with_resources
    tags:
    - Open Data
    - CKAN
    - Metadata
    - Datasets
    properties:
      - type: Documentation
        url: https://www.universidata.es/el-api
  - aid: complutense-university-of-madrid:universidata-dcat
    name: UniversiDATA DCAT Catalog API
    x-operator: tenant
    description: >-
      DCAT catalogue endpoint of UniversiDATA, addressed per participating
      university by acronym. The UCM catalogue is the only UCM-specific path on
      this host. Probed 2026-08-30: the previously recorded base
      /api/universidades/ returns HTTP 404; /api/universidades/ucm returns HTTP
      200 application/xml, 561329 bytes of rdf:RDF using dcat, dct, foaf and
      adms. The pointer has been re-based onto the working UCM path.
    humanURL: https://www.universidata.es/el-api
    baseURL: https://universidatacatalog.azurewebsites.net/api/universidades/ucm
    tags:
    - Open Data
    - DCAT
    - Catalog
    - Metadata
    properties:
      - type: Documentation
        url: https://www.universidata.es/el-api
x-coverage:
  state: covered
  reason: covered
  detail: >-
    UCM operates no developer portal and publishes no specification of its own,
    but it is not a blank profile: a 2026-08-30 re-probe confirmed two
    institution-operated machine-readable surfaces on ucm.es (the Docta
    Complutense DSpace 7.6.5 REST/HAL API and its OAI-PMH 2.0 endpoint), one
    tenant identity-federation entity in eduGAIN via RedIRIS SIR, and three
    tenant open-data APIs on the five-university UniversiDATA consortium
    platform carrying 13 UCM datasets. The June 2026 profile classed the
    UniversiDATA hosts as institution-owned; they are not — universidata.es
    serves UAM, UCM, UHU, UVa and URJC, and the cohort-derived vendor check was
    blind to it because the other four members are not in the 248-university
    roster. The DCAT pointer was dead (404) and has been re-based. No course
    catalog, timetable, library discovery, research-computing or campus-life API
    was found on any ucm.es host; api./datos./opendata./data.ucm.es do not
    resolve. No llms.txt on www.ucm.es or docta.ucm.es (both 404). No
    institutional privacy-policy page could be resolved — www.ucm.es links to
    https://www.ucm.es/datos-personales from its own aviso legal and that URL
    returns 404 — so no PrivacyPolicy pointer is emitted.
