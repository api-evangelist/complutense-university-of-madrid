  - aid: complutense-university-of-madrid:identity-federation
    name: UCM SAML 2.0 Identity Provider (RedIRIS SIR / eduGAIN)
    x-operator: tenant
    description: >-
      UCM's institutional single sign-on, registered in eduGAIN through RedIRIS
      SIR, the Spanish national research and education federation. entityID
      https://www.rediris.es/sir/ucmidp, role IDPSSODescriptor, shibmd:Scope
      ucm.es, Sirtfi asserted, first seen in eduGAIN 2017-04-13. Probed
      2026-08-30: the entityID returns HTTP 200 text/xml, 10279 bytes of SAML
      2.0 metadata with SSOService and SingleLogoutService at
      https://sir.rediris.es/ucm/saml2/idp/. Operator is tenant, not
      institution — the IdP runs on RedIRIS infrastructure under a UCM-specific
      /ucm/ path — but the entity, the scope and the user population are UCM's.
    humanURL: https://www.rediris.es/sir/
