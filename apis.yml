    x-operator: institution
    description: >-
      Docta Complutense is UCM's open-access institutional repository, migrated
      in 2023 to DSpace 7 and self-hosted on UCM's own domain. Probed
      2026-08-30: GET https://docta.ucm.es/rest/api returns HTTP 200
